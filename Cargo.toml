[package]
name = "pomodoro"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ozanenginoglu/pomodoro"

[dependencies]
raw-window-handle = "0.6"
env_logger = "0.11.11"
gpui = { version = "=0.3.11", package = "gpui-pre" }
log = "0.4.35"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tiny-skia = "0.11"
smallvec = { version = "1", default-features = false }
image = { version = "0.25", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
directories = "6.0.0"
rodio = { version = "0.23", default-features = false, features = ["playback"] }
notify-rust = "4.19"
interprocess = "2.4"
async-channel = "2"
anyhow = "1.0.104"
serde_json = "1.0.154"
# Göz animasyonunun rastgele bakışları ve göz kırpmaları.
fastrand = "2"

# Linux arka uçları gpui_platform'da varsayılan olarak kapalı; ikisini de açıyoruz.
# Çalışırken ortama göre seçilir: WAYLAND_DISPLAY varsa Wayland, yoksa X11.
[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { version = "=0.3.11", package = "gpui-pre-platform", features = ["x11", "wayland"] }
# GPUI'nin X11 "leave" olayı xmonad altında güvenilir gelmiyor; imleci doğrudan sorguluyoruz.
# MIT-SCREEN-SAVER: kullanıcı en son ne zaman klavye/fare kullandı.
x11rb = { version = "0.13", features = ["screensaver"] }
# Wayland'de klavye/fare hareketsizliği: ext-idle-notify-v1 (GPUI ile aynı sürümler).
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[target.'cfg(windows)'.dependencies]
gpui_platform = { version = "=0.3.11", package = "gpui-pre-platform" }
# GPUI ile aynı sürüm: daire bölgesi, üstte durma ve konum.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_SystemInformation",
] }
# Oturum açılınca başlatma (HKCU\...\Run).
windows-registry = "0.6"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
