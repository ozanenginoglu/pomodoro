name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            binary: pomodoro
            artifact: pomodoro-linux-x86_64
          - name: Windows
            os: windows-latest
            binary: pomodoro.exe
            artifact: pomodoro-windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Sistem kütüphaneleri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Testler
        run: cargo test --locked

      - name: Derleme (release)
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error

  release:
    name: Sürüm
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Dosya adları
        run: |
          mv dist/pomodoro-linux-x86_64/pomodoro dist/pomodoro-linux-x86_64.bin
          mv dist/pomodoro-windows-x86_64/pomodoro.exe dist/pomodoro-windows-x86_64.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pomodoro-linux-x86_64.bin
            dist/pomodoro-windows-x86_64.exe
          generate_release_notes: true
